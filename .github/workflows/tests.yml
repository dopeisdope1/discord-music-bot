# Le déploiement en production se fait sur le VPS via
# .github/workflows/deploy.yml, qui ne se déclenche QUE si ce workflow-ci est
# vert sur `main`. Cette CI est donc le dernier endroit où une régression peut
# encore être arrêtée avant la prod.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # À garder alignée sur la version de Node de l'image Docker de
          # production : un écart de version majeure ferait passer un test ici
          # et échouer le bot là-bas.
          node-version: "22"
          cache: npm

      # `npm ci` plutôt qu'`install` : installe exactement le package-lock,
      # sans le réécrire au passage.
      - run: npm ci

      - run: npm test
