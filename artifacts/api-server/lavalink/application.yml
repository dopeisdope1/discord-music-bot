server:
  # Railway impose le port via la variable PORT. 2333 n'est qu'un repli pour
  # un lancement en local.
  port: ${PORT:2333}
  # "::" et non "0.0.0.0" : le réseau privé de Railway est en IPv6, un service
  # qui n'écoute qu'en IPv4 y est injoignable. L'écoute sur "::" couvre les
  # deux familles d'adresses.
  address: "::"

lavalink:
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      # La source YouTube intégrée de Lavalink n'est plus fiable : c'est
      # l'extension youtube-plugin ci-dessous qui la remplace. Les deux
      # activées en même temps entrent en conflit, d'où le false ici.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    # Tampons volontairement modestes : chaque lecteur en alloue, et le
    # conteneur a été tué pour dépassement mémoire avec des valeurs plus
    # généreuses (redémarrages en pleine lecture, sans trace côté Java).
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  plugins:
    # Lecture YouTube. Cette version doit être tenue à jour : YouTube modifie
    # régulièrement le chiffrement des signatures de son lecteur, et une
    # version en retard échoue avec "Must find sig function from script" —
    # le titre est trouvé mais le flux audio refuse de s'ouvrir.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Résolution des liens Spotify (titres, albums, playlists publiques).
    # Sans elle, coller une URL Spotify ne donne rien.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false

plugins:
  youtube:
    enabled: true
    # Ordre choisi pour éviter le déchiffrement du lecteur web, que YouTube
    # refuse depuis une adresse de centre de données comme celle de Railway
    # ("Must find sig function", tous clients confondus). TVHTML5EMBEDDED et
    # ANDROID_VR empruntent des chemins qui n'en dépendent pas ; WEB et
    # WEBEMBEDDED sont retirés car ils exigent désormais un jeton
    # d'authentification (PoToken) qu'on ne fournit pas.
    # Noms valides pour cette extension : MUSIC, WEB, MWEB, WEBEMBEDDED,
    # ANDROID, ANDROID_MUSIC, ANDROID_VR, IOS, TV, TVHTML5_SIMPLY. Un nom
    # inconnu est ignoré en silence (un simple avertissement au démarrage),
    # d'où l'importance de s'en tenir à cette liste.
    clients:
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - TV
      - MUSIC

    # Porte de sortie au blocage de YouTube. Tant que l'hébergeur n'a pas de
    # compte à présenter, YouTube refuse tout ("Sign in to confirm you're not a
    # bot") et le son ne peut venir que de SoundCloud — ce qui n'y est pas est
    # donc injouable, quel que soit le bot.
    #
    # Désactivé par défaut : rien ne change tant que YOUTUBE_OAUTH n'est pas
    # mis à "true" sur le service. La marche à suivre (une seule fois, avec un
    # compte Google jetable) est décrite dans le README, section "2bis".
    oauth:
      enabled: ${YOUTUBE_OAUTH:false}
      # Vide au premier démarrage : l'extension affiche alors un lien
      # d'autorisation dans les journaux, puis y écrit le jeton à recopier ici
      # via la variable. Une chaîne vide est traitée comme absente.
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"

  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: FR
      playlistLoadLimit: 6
      albumLoadLimit: 6
    providers:
      # Spotify ne fournit pas de flux audio exploitable : LavaSrc récupère
      # les métadonnées puis retrouve la piste ailleurs. SoundCloud en tête
      # car YouTube refuse les requêtes venues d'un centre de données
      # ("Sign in to confirm you're not a bot"). Les entrées YouTube restent
      # en dernier recours, au cas où l'accès redeviendrait possible.
      - "scsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"

logging:
  level:
    root: INFO
    lavalink: INFO
    # Sans cette ligne, le lien d'autorisation YouTube et le jeton qui suit
    # ne s'affichent nulle part : l'inscription OAuth est alors impossible à
    # mener à bien, faute de voir ce qu'il faut recopier.
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
